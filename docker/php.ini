; Production PHP settings for the TG Gateways image.
;
; The official php:* images ship php.ini-development and php.ini-production but do
; not install either, so PHP falls back to compiled defaults where display_errors
; is ON. Any warning — from Xdebug, a deprecation notice, or a stray notice — is
; then printed into the response body. For an API that answers JSON and for a
; checkout page that sets cookies and headers, that is a real failure mode:
; "headers already sent", unparseable JSON, or a debugger banner shown to a paying
; customer.
;
; Errors still go to stderr, which Docker captures (docker compose logs -f web).

expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
html_errors = Off

; Never trust client input for paths or remote includes.
allow_url_include = Off
allow_url_fopen = Off

; Sessions are handled by the application (includes/auth.php); these are the
; hardening defaults the app relies on.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Uploads are not part of the product surface.
file_uploads = Off
max_execution_time = 30

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
