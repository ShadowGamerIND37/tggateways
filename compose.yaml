services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: tggateways
      SESSION_SECURE: ${SESSION_SECURE:-false}
      # One variable drives both the published host port and the public base URL
      # the app generates checkout links from, so they cannot drift apart. Set
      # TG_HTTP_PORT (and, for production, APP_URL) in .env.
      APP_URL: ${APP_URL:-http://localhost:${TG_HTTP_PORT:-8090}}
    ports:
      # 8080 is the most commonly occupied port on a developer machine (other
      # projects, Tomcat, Jenkins, local proxies), so the default is 8090.
      - "${TG_HTTP_PORT:-8090}:80"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/health.php >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tggateways
      MYSQL_USER: ${DB_USER:-tggateways}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - tg-mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: tggateways
    command: ["sh", "-c", "while true; do php /var/www/html/cron/imap-parser.php; sleep 5; done"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # The worker records every completed pass in system_state, so this checks
      # that polling is actually running — not merely that an extension loaded.
      test: ["CMD", "php", "/var/www/html/cron/healthcheck.php"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  tg-mysql:
